svg.ill .ill-bg { fill: var(--surface, #ffffff); }
svg.ill .ill-zone { fill: var(--surface-subtle, #eff6f8); stroke: var(--border, #d5e4e8); stroke-width: 1; }
svg.ill .ill-tailnet { fill: none; stroke: var(--border-strong, #b8cfd6); stroke-width: 1.5; stroke-dasharray: 6 5; }
svg.ill .ill-zone-label { fill: var(--fg-muted, #4a6670); font: 600 12px var(--font-label, "IBM Plex Mono", ui-monospace, monospace); letter-spacing: 0.06em; text-transform: uppercase; }
svg.ill .ill-node { fill: var(--surface, #ffffff); stroke: var(--border-strong, #b8cfd6); stroke-width: 1; }
svg.ill .ill-node--key { fill: var(--diagram-node, #ecfeff); stroke: var(--diagram-line, #0e7490); stroke-width: 1.5; }
svg.ill .ill-text { fill: var(--fg, #0b2530); font-size: 15px; text-anchor: middle; }
svg.ill .ill-edge { fill: none; stroke: var(--diagram-line, #0e7490); stroke-width: 1.5; }
svg.ill .ill-edge--soft { stroke-dasharray: 4 4; }
svg.ill .ill-head { fill: var(--diagram-line, #0e7490); }
svg.ill .ill-label { fill: var(--fg-muted, #4a6670); font: 12px var(--font-label, "IBM Plex Mono", ui-monospace, monospace); paint-order: stroke; stroke: var(--surface, #ffffff); stroke-width: 5px; stroke-linejoin: round; }
@media (prefers-color-scheme: dark) {
  svg.ill .ill-bg, svg.ill .ill-node { fill: var(--surface, #0b1216); }
  svg.ill .ill-zone { fill: var(--surface-subtle, #0f191f); stroke: var(--border, #1b3a45); }
  svg.ill .ill-tailnet, svg.ill .ill-node { stroke: var(--border-strong, #1b3a45); }
  svg.ill .ill-zone-label, svg.ill .ill-label { fill: var(--fg-muted, #6fa3ad); }
  svg.ill .ill-label { stroke: var(--surface, #0b1216); }
  svg.ill .ill-node--key { fill: var(--diagram-node, #0b1216); stroke: var(--diagram-line, #00f0ff); }
  svg.ill .ill-text { fill: var(--fg, #c7f9ff); }
  svg.ill .ill-edge { stroke: var(--diagram-line, #00f0ff); }
  svg.ill .ill-head { fill: var(--diagram-line, #00f0ff); }
}
</style>
